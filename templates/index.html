<!DOCTYPE html>
<html lang="id">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLP Indonesia Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-muted: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #6366f1;
      --bot-bubble: #243044;
      --user-bubble: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(34, 211, 238, 0.12), transparent);
    }

    .chat-app {
      width: 100%;
      max-width: 480px;
      height: min(780px, calc(100vh - 32px));
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 20px 20px 16px;
      background: rgba(26, 35, 50, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(12px);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .header-info h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--surface-2);
      border-radius: 3px;
    }

    .message-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.35s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message-row.bot .msg-avatar {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
    }

    .message-row.user .msg-avatar {
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .bubble-wrap {
      max-width: 78%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-row.user .bubble-wrap {
      align-items: flex-end;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.92rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .message-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    }

    .time {
      font-size: 0.7rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .typing-row {
      display: none;
      gap: 10px;
      align-items: flex-end;
      padding: 0 0 4px;
    }

    .typing-row.visible {
      display: flex;
      animation: fadeUp 0.3s ease-out;
    }

    .typing-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 6px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .chat-input-area {
      padding: 16px;
      background: rgba(26, 35, 50, 0.95);
      border-top: 1px solid var(--border);
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 6px 6px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap:focus-within {
      border-color: rgba(34, 211, 238, 0.4);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
    }

    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      padding: 10px 0;
    }

    .input-wrap input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      transform: scale(1.05);
    }

    .send-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .quick-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      border-color: rgba(34, 211, 238, 0.4);
      color: var(--accent);
      background: rgba(34, 211, 238, 0.08);
    }

    .hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="avatar">🤖</div>
      <div class="header-info">
        <h1>NLP Indonesia</h1>
        <p><span class="status-dot"></span> Asisten virtual · Online</p>
      </div>
    </header>

    <div class="chat-messages" id="chat-messages">
      <div class="message-row bot">
        <div class="msg-avatar">🤖</div>
        <div class="bubble-wrap">
          <div class="bubble">Halo! Saya asisten virtual NLP Indonesia. Ada yang bisa saya bantu? 😊</div>
          <span class="time" id="welcome-time"></span>
        </div>
      </div>
    </div>

    <div class="typing-row" id="typing-indicator">
      <div class="msg-avatar" style="background: linear-gradient(135deg, #6366f1, #22d3ee); display:flex; align-items:center; justify-content:center; font-size:14px;">🤖</div>
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="quick-replies" id="quick-replies">
        <button type="button" class="quick-btn" data-msg="halo">👋 Halo</button>
        <button type="button" class="quick-btn" data-msg="boleh sewa mobil?">🚗 Sewa mobil</button>
        <button type="button" class="quick-btn" data-msg="jam berapa bukanya?">🕐 Jam buka</button>
        <button type="button" class="quick-btn" data-msg="mobilnya apa aja?">📋 Daftar mobil</button>
      </div>
      <form id="chat-form">
        {% csrf_token %}
        <div class="input-wrap">
          <input
            type="text"
            id="user-input"
            name="user_message"
            placeholder="Ketik pesan..."
            autocomplete="off"
            maxlength="250"
            required
          >
          <button type="submit" class="send-btn" id="send-btn" aria-label="Kirim">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </form>
      <p class="hint">Tekan Enter untuk mengirim · Powered by NLP Indonesia</p>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const quickReplies = document.getElementById('quick-replies');
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    document.getElementById('welcome-time').textContent = formatTime(new Date());

    function formatTime(date) {
      return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendMessage(text, role) {
      const row = document.createElement('div');
      row.className = 'message-row ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'bot' ? '🤖' : '👤';

      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(new Date());

      wrap.appendChild(bubble);
      wrap.appendChild(time);
      row.appendChild(avatar);
      row.appendChild(wrap);
      chatMessages.appendChild(row);
      scrollToBottom();
    }

    function setTyping(visible) {
      typingIndicator.classList.toggle('visible', visible);
      if (visible) scrollToBottom();
    }

    function setLoading(loading) {
      sendBtn.disabled = loading;
      userInput.disabled = loading;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message) return;

      appendMessage(message, 'user');
      userInput.value = '';
      setLoading(true);
      setTyping(true);

      try {
        const formData = new FormData();
        formData.append('user_message', message);
        formData.append('csrfmiddlewaretoken', csrfToken);

        const response = await fetch('{% url "submit" %}', {
          method: 'POST',
          body: formData,
          headers: { 'X-Requested-With': 'XMLHttpRequest' },
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Gagal mengirim pesan');
        }

        setTyping(false);
        appendMessage(data.bot_message, 'bot');
      } catch (err) {
        setTyping(false);
        appendMessage('Maaf, terjadi kesalahan. Silakan coba lagi.', 'bot');
      } finally {
        setLoading(false);
        userInput.focus();
      }
    }

    chatForm.addEventListener('submit', function(e) {
      e.preventDefault();
      sendMessage(userInput.value);
    });

    quickReplies.addEventListener('click', function(e) {
      const btn = e.target.closest('.quick-btn');
      if (btn) sendMessage(btn.dataset.msg);
    });

    userInput.focus();
    scrollToBottom();
  </script>
</body>
</html>
